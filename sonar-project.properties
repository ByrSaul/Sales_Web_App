sonar.projectKey=sales4app-web-frontend
sonar.projectName=Sales4App Web Frontend
sonar.projectVersion=1.0

sonar.host.url=http://192.168.1.163:9000
sonar.sourceEncoding=UTF-8

# Analizar todo el codigo del frontend
sonar.sources=src

# Archivos de pruebas
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Excluir pruebas del codigo productivo
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Cobertura
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.sonar.json